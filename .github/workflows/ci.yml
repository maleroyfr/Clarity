name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Clarity-CI-${{ github.run_id }}-${{ github.run_attempt }}!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CLARITY_TEST_SQL: Server=localhost,1433;Database=master;User Id=sa;Password=Clarity-CI-${{ github.run_id }}-${{ github.run_attempt }}!;Encrypt=True;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release -warnaserror
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet test --no-build --configuration Release
      - name: PowerShell contracts
        if: hashFiles('scripts/**/*.Tests.ps1') != ''
        shell: pwsh
        run: |
          if (-not (Get-Module Pester -ListAvailable | Where-Object Version -ge 5.0)) {
            Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force
          }
          Import-Module Pester -MinimumVersion 5.0
          Invoke-Pester -Path scripts -CI
      - name: Build and lint Bicep
        if: hashFiles('infra/main.bicep') != ''
        run: |
          az bicep build --file infra/main.bicep
          for parameter_file in infra/parameters/*.bicepparam; do
            az bicep build-params --file "$parameter_file"
          done
